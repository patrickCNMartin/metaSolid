default_stages: [pre-push]
repos:
  # rev must match the ruff pin in pyproject.toml, or the hook and CI reformat each other.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: ['--fix']
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', 'security/.secrets.baseline']
        # The baseline stores hashed findings; scanning it re-reports them.
        exclude: ^security/\.secrets\.baseline$
