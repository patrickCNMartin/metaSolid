[project]
name = "metasolid"
version = "0.1.0"
description = "Meta Data Consolidation - IDS - METASOLID"
requires-python = ">=3.13"

# The only place a Python package is named. oci.nix restates this list by hand.
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.22",  # same as the pre-commit rev
    "detect-secrets",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "responses",
]
notebook = [
    "jupyterlab",
    "ipykernel",
    "seaborn",
]

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["metasolid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
