[project]
name = "metasolid"
version = "0.1.0"
description = "Meta Data Consolidation - IDS - METASOLID"
requires-python = ">=3.13"

dependencies = [
    # Data
    "numpy",
    "numba",
    "scipy",
    "scikit-learn",
    "umap-learn",
    "python-dateutil",

    # Reporting & Figures
    "matplotlib",
    "python-pptx",

    # LLM/DL
    # NOTE: no vendor SDKs by design -- all LLM/embedding access goes through
    # plain `requests` against OpenAI-compatible HTTP endpoints.

    # Utilities
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
# Only needed by the exploratory notebooks under src/explore/.
notebook = [
    "seaborn",
]
dev = [
    "jupyterlab",
    "ipython",
    "ipykernel",
    "ruff",
    "detect-secrets",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "responses"
]

[build-system]
requires = ["setuptools>=65", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"


[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]